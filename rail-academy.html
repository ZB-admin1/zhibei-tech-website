<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>轨道科普 · 智北学院</title>
<link rel="stylesheet" href="css/rail.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚆</text></svg>">
</head><body>
<!-- Loading -->
<div class="rb-loader" id="rbLoader">
  <div class="rb-loader-logo">🚆</div>
  <div class="rb-loader-text">智北轨道科普 · 正在加载课程库…</div>
</div>

<!-- App -->
<div class="rb-app" id="rbApp" style="display:none">
  <!-- Navbar -->
  <header class="rb-nav">
    <div class="rb-nav-inner">
      <a href="index.html" class="rb-logo">
        <div class="rb-logo-ic">智</div>
        <div class="rb-logo-text">
          <div class="rb-logo-t1">智北学院</div>
          <div class="rb-logo-t2">轨道科普</div>
        </div>
      </a>
      <nav class="rb-nav-links">
        <a href="index.html">🏠 官网</a>
        <a href="enterprise.html">🏢 企业后台</a>
        <a href="workbench.html">💼 工作台</a>
        <a href="#" class="rb-active">🚆 轨道科普</a>
      </nav>
      <div class="rb-nav-right">
        <span class="rb-stats">
          💰 <span id="rbQuota">—</span> tokens · 
          ✅ <span id="rbProgress">0</span>/2000
        </span>
        <a href="#" class="rb-login-btn" id="rbLoginBtn" onclick="openRailAuth()">登录</a>
        <a href="#" class="rb-logout-btn" id="rbLogoutBtn" style="display:none" onclick="doRailLogout()">退出</a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="rb-main" id="rbMain">
    <!-- Views injected here -->
  </main>
</div>

<!-- Login Modal -->
<div class="rb-modal-bg" id="rbLoginModal" style="display:none">
  <div class="rb-modal">
    <div class="rb-modal-head"><h3>登录智北学院</h3><span onclick="document.getElementById('rbLoginModal').style.display='none'" class="rb-close">✕</span></div>
    <div class="rb-modal-body">
      <div class="rb-f"><label>账号</label><input id="rbMUser" placeholder="账号 / 手机号 / 邮箱"></div>
      <div class="rb-f"><label>密码</label><input id="rbMPass" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doRailLogin()"></div>
      <div class="rb-err" id="rbMErr"></div>
      <button class="rb-btn-primary" id="rbMBtn" onclick="doRailLogin()">登录</button>
      <div class="rb-hint">💡 <a href="#" onclick="openRailRegister();return false;">没有账号？立即注册 →</a></div>
    </div>
  </div>
</div>

<!-- Register Modal (Enhanced v2: multi-step) -->
<div class="rb-modal-bg" id="rbRegisterModal" style="display:none">
  <div class="rb-modal rb-register">
    <div class="rb-modal-head">
      <h3>📝 注册智北学院</h3>
      <span onclick="closeRailRegister()" class="rb-close">✕</span>
    </div>
    <div class="rb-reg-steps">
      <div class="rb-reg-step" id="rbRegStep1"><span>1</span>验证</div>
      <div class="rb-reg-step" id="rbRegStep2"><span>2</span>密码</div>
      <div class="rb-reg-step" id="rbRegStep3"><span>3</span>身份</div>
      <div class="rb-reg-step" id="rbRegStep4"><span>4</span>完成</div>
    </div>
    <div class="rb-modal-body">
      <!-- Step 1: Phone/Email verify -->
      <div class="rb-reg-panel" id="rbRegPanel1">
        <div class="rb-reg-tabs">
          <button class="rb-reg-tab active" id="rbTabPhone" onclick="switchRegTab('phone')">📱 手机号</button>
          <button class="rb-reg-tab" id="rbTabEmail" onclick="switchRegTab('email')">✉️ 邮箱</button>
        </div>
        <div class="rb-f" id="rbPhoneField"><label>手机号</label><input id="rbRegPhone" placeholder="11 位手机号" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')"></div>
        <div class="rb-f" id="rbEmailField" style="display:none"><label>邮箱地址</label><input id="rbRegEmail" placeholder="your@email.com"></div>
        <div class="rb-f">
          <label>验证码</label>
          <div class="rb-code-row">
            <input id="rbRegCode" placeholder="6 位验证码" maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
            <button class="rb-btn-secondary" id="rbSendCodeBtn" onclick="sendRegCode()">获取验证码</button>
          </div>
        </div>
        <div class="rb-mock-hint" id="rbMockHint" style="display:none"></div>
        <div class="rb-f"><label>用户名</label><input id="rbRegUsername" placeholder="3-20 字符（字母数字中文）" maxlength="20"></div>
        <div class="rb-err" id="rbRegErr1"></div>
        <button class="rb-btn-primary" onclick="nextRegStep(1)">下一步 →</button>
      </div>

      <!-- Step 2: Password + ID Card + Face -->
      <div class="rb-reg-panel" id="rbRegPanel2" style="display:none">
        <div class="rb-f"><label>密码</label><input id="rbRegPassword" type="password" placeholder="至少 6 位" oninput="checkPasswordStrength(this.value)"></div>
        <div class="rb-strength-bar"><div class="rb-strength-fill" id="rbStrengthFill"></div><span id="rbStrengthLabel">强度检测</span></div>
        <div class="rb-f"><label>确认密码</label><input id="rbRegPassword2" type="password" placeholder="再输一次" oninput="matchRegPasswords()"></div>
        <div class="rb-match-hint" id="rbMatchHint"></div>
        <div class="rb-f"><label>身份证号（可选）</label><input id="rbRegIdCard" placeholder="18 位身份证号" maxlength="18"></div>
        <!-- Face capture area -->
        <div class="rb-face-area">
          <label>人脸采集（可选）</label>
          <div class="rb-face-container">
            <video id="rbFaceVideo" width="220" height="165" style="display:none;border-radius:8px;background:#000"></video>
            <canvas id="rbFaceCanvas" width="220" height="165" style="display:none;border-radius:8px"></canvas>
            <div class="rb-face-placeholder" id="rbFacePlaceholder">📷 点击开启摄像头采集人脸<br><span style="font-size:11px;opacity:.7">仅采集不存储原数据，仅存 hash 验证</span></div>
            <div class="rb-face-taken" id="rbFaceTaken" style="display:none">✅ 已采集人脸</div>
          </div>
          <button type="button" class="rb-btn-secondary" id="rbFaceBtn">📷 开启摄像头</button>
        </div>
        <div class="rb-err" id="rbRegErr2"></div>
        <div class="rb-reg-nav">
          <button class="rb-btn-secondary" onclick="prevRegStep(2)">← 上一步</button>
          <button class="rb-btn-primary" onclick="nextRegStep(2)">下一步 →</button>
        </div>
      </div>

      <!-- Step 3: Identity + Activation -->
      <div class="rb-reg-panel" id="rbRegPanel3" style="display:none">
        <div class="rb-f">
          <label>身份</label>
          <select id="rbRegIdentity">
            <option value="student">🎒 学生</option>
            <option value="teacher">👩‍🏫 教师</option>
            <option value="parent">👨‍👩‍👧 家长</option>
            <option value="engineer">⚙️ 工程师</option>
            <option value="other">💼 其他</option>
          </select>
        </div>
        <div class="rb-f">
          <label>激活码（可选）</label>
          <input id="rbRegActivation" placeholder="ZB-XXXXX-XXXXX（可用于解锁课程）">
          <div class="rb-hint" style="font-size:11px;opacity:.7">填写激活码可直接解锁对应课程</div>
        </div>
        <div class="rb-agree">
          <input type="checkbox" id="rbAgreeTerms" checked>
          <label for="rbAgreeTerms">我已阅读并同意智北学院用户协议和隐私政策</label>
        </div>
        <div class="rb-err" id="rbRegErr3"></div>
        <div class="rb-reg-nav">
          <button class="rb-btn-secondary" onclick="prevRegStep(3)">← 上一步</button>
          <button class="rb-btn-primary" id="rbSubmitBtn" onclick="submitRegistration()">🚀 完成注册</button>
        </div>
      </div>

      <!-- Step 4: Success -->
      <div class="rb-reg-panel" id="rbRegPanel4" style="display:none;text-align:center;padding:30px 20px">
        <div class="rb-success-icon">🎉</div>
        <h3 style="margin:10px 0">注册成功！</h3>
        <p class="rb-hint" id="rbSuccessMsg">正在为您跳转…</p>
      </div>
    </div>
  </div>
</div>

<!-- Purchase Modal -->
<div class="rb-modal-bg" id="rbBuyModal" style="display:none">
  <div class="rb-modal rb-buy">
    <div class="rb-modal-head"><h3>🔒 解锁此内容</h3><span onclick="document.getElementById('rbBuyModal').style.display='none'" class="rb-close">✕</span></div>
    <div class="rb-modal-body" id="rbBuyBody"></div>
    <div class="rb-modal-foot">
      <button class="rb-btn-secondary" onclick="document.getElementById('rbBuyModal').style.display='none'">取消</button>
      <button class="rb-btn-primary" id="rbBuyBtn" onclick="confirmRailBuy()">确认解锁</button>
    </div>
  </div>
</div>

<script defer src="js/rail.js?v=20261101_reg2"></script>
</body></html>
