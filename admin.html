<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智北科技 · Admin 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #05060a; }
    .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-sidebar { background: #0a0c14; border-right: 1px solid var(--border-glass); padding: 24px 16px; position: sticky; top: 0; height: 100vh; }
    .admin-logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; margin-bottom: 32px; padding: 0 8px; }
    .admin-nav { list-style: none; }
    .admin-nav a { display: block; padding: 12px 16px; color: var(--text-secondary); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-size: 14px; transition: all 0.2s; }
    .admin-nav a:hover, .admin-nav a.active { background: var(--bg-glass); color: var(--accent-cyan); }
    .admin-main { padding: 40px; padding-top: 100px; }
    .admin-topbar { position: fixed; top: 0; left: 240px; right: 0; height: 64px; background: rgba(10,12,20,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 100; }
    .admin-topbar h1 { font-size: 18px; font-weight: 700; }
    .admin-user { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); }
    .logout-btn { padding: 8px 16px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: #ef4444; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: rgba(239,68,68,0.25); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 24px; }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 800; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Tables */
    .card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px 16px; background: rgba(0,0,0,0.3); font-size: 12px; color: var(--accent-purple); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-glass); font-size: 14px; color: var(--text-secondary); }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .role-badge { padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .role-admin { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .role-user { background: rgba(0,240,255,0.15); color: var(--accent-cyan); border: 1px solid rgba(0,240,255,0.3); }
    .api-key { font-family: monospace; font-size: 12px; color: var(--accent-cyan); background: rgba(0,0,0,0.2); padding: 3px 8px; border-radius: 4px; }
    .quota-input { width: 100px; padding: 6px 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: 6px; color: var(--text-primary); font-size: 13px; }
    .quota-save-btn { padding: 6px 12px; background: var(--gradient-main); color: var(--bg-primary); border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px; }

    /* Login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .login-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 48px; backdrop-filter: blur(20px); }
    .login-box h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .login-box p { color: var(--text-muted); margin-bottom: 32px; font-size: 14px; }
    .login-box .form-group { margin-bottom: 20px; }
    .login-box label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .login-box input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 15px; font-family: inherit; }
    .login-box input:focus { outline: none; border-color: var(--accent-cyan); }
    .login-box button { width: 100%; padding: 14px; background: var(--gradient-main); border: none; border-radius: var(--radius-sm); color: var(--bg-primary); font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-box button:hover { box-shadow: 0 0 30px rgba(0,240,255,0.4); }
    .login-error { color: #ef4444; font-size: 13px; margin-bottom: 16px; display: none; }

    /* Model chart */
    .model-bars { display: flex; flex-direction: column; gap: 16px; }
    .model-bar { display: grid; grid-template-columns: 120px 1fr 60px; align-items: center; gap: 16px; }
    .model-bar .bar-track { height: 8px; background: var(--bg-glass); border-radius: 100px; overflow: hidden; }
    .model-bar .bar-fill { height: 100%; background: var(--gradient-main); border-radius: 100px; transition: width 0.6s ease; }
    .model-bar .bar-val { font-family: monospace; font-size: 13px; color: var(--accent-cyan); text-align: right; }

    @media (max-width: 768px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: relative; height: auto; }
      .admin-topbar { left: 0; }
    }
  </style>
</head>
<body>
<div class="grid-bg"></div>

<!-- Login View -->
<div id="loginView" class="login-wrap">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px;">
      <div class="logo-icon" style="display:inline-block;width:60px;height:60px;background:var(--gradient-main);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#05060a;">智</div>
    </div>
    <h1 style="text-align:center;">Admin 管理后台</h1>
    <p style="text-align:center;">智北科技 AI 平台 · 超级管理员</p>
    <div id="loginError" class="login-error">登录失败，请检查账号密码</div>
    <div class="form-group">
      <label>管理员账号</label>
      <input type="text" id="adminUser" placeholder="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="adminPass" placeholder="CSFXlhy14">
    </div>
    <button id="adminLoginBtn">进入管理后台</button>
    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">默认密码: admin / CSFXlhy14</p>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashView" class="admin-layout" style="display:none;">
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <div class="logo-icon" style="width:32px;height:32px;font-size:14px;">智</div>
      <span class="logo-text">Admin Panel</span>
    </div>
    <ul class="admin-nav">
      <li><a href="#" class="active" data-view="overview">📊 数据概览</a></li>
      <li><a href="#" data-view="users">👥 用户管理</a></li>
      <li><a href="#" data-view="models">🧠 模型调用</a></li>
      <li><a href="index.html">↩️ 返回官网</a></li>
    </ul>
  </aside>

  <div>
    <div class="admin-topbar">
      <h1 id="viewTitle">📊 数据概览</h1>
      <div class="admin-user">
        <span id="userBadge">admin</span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <main class="admin-main">
      <!-- Overview -->
      <div id="view-overview">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">总 API 调用</div>
            <div class="value" id="statTotalCalls">0</div>
            <div class="sub">累计</div>
          </div>
          <div class="stat-card">
            <div class="label">总 Token 消耗</div>
            <div class="value" id="statTotalTokens">0</div>
            <div class="sub">累计</div>
          </div>
          <div class="stat-card">
            <div class="label">注册用户</div>
            <div class="value" id="statTotalUsers">0</div>
            <div class="sub">含 1 位管理员</div>
          </div>
          <div class="stat-card">
            <div class="label">今日调用</div>
            <div class="value" id="statTodayCalls">0</div>
            <div class="sub">近 24 小时</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">🧠 各模型调用量</div></div>
          <div id="modelBars" class="model-bars"><div style="color:var(--text-muted);">暂无数据，先访问 API 端点生成记录</div></div>
        </div>
      </div>

      <!-- Users -->
      <div id="view-users" style="display:none;">
        <div class="card">
          <div class="card-header"><div class="card-title">👥 用户列表</div></div>
          <table>
            <thead><tr>
              <th>用户名</th><th>角色</th><th>邮箱</th><th>API Key</th><th>Token 配额</th><th>创建时间</th><th>操作</th>
            </tr></thead>
            <tbody id="userTableBody"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Models -->
      <div id="view-models" style="display:none;">
        <div class="card">
          <div class="card-header"><div class="card-title">📈 模型调用详情</div></div>
          <div id="modelDetail" style="color:var(--text-muted);">加载中...</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
(function(){
  'use strict';
  const LS_KEY = 'zb_admin_token';
  let token = localStorage.getItem(LS_KEY) || '';

  function api(url, method, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined })
      .then(r => { if (r.status === 401) { logout(); throw new Error('unauthorized'); } return r.json(); });
  }
  function base(p) { return p.startsWith('/api') ? p : ('/' + p); }

  function showDash() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'grid';
    document.getElementById('userBadge').textContent = document.querySelector('.admin-login-name')?.textContent || 'admin';
    loadOverview();
  }
  function showLogin() {
    document.getElementById('loginView').style.display = '';
    document.getElementById('dashView').style.display = 'none';
    token = ''; localStorage.removeItem(LS_KEY);
  }
  function logout() { showLogin(); }

  function login() {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value;
    api('/api/login', 'POST', { username: u, password: p }).then(d => {
      if (d.role !== 'admin') { alert('非管理员账号'); return; }
      token = d.token;
      localStorage.setItem(LS_KEY, token);
      document.querySelector('.admin-login-name')?.remove();
      const userBadge = document.getElementById('userBadge');
      userBadge.innerHTML = '<span class="admin-login-name">' + d.username + '</span>';
      showDash();
    }).catch(() => {
      document.getElementById('loginError').style.display = 'block';
    });
  }

  async function loadOverview() {
    const stats = await api('/api/admin/stats');
    document.getElementById('statTotalCalls').textContent = (stats.total_calls || 0).toLocaleString();
    document.getElementById('statTotalTokens').textContent = (stats.total_tokens || 0).toLocaleString();
    document.getElementById('statTotalUsers').textContent = stats.total_users || 0;
    const today = new Date().toISOString().slice(0,10);
    const todayStat = stats.daily?.[today]?.calls || 0;
    document.getElementById('statTodayCalls').textContent = todayStat.toLocaleString();

    // Model bars
    const models = stats.calls_by_model || {};
    const modelNames = Object.keys(models);
    if (modelNames.length === 0) {
      document.getElementById('modelBars').innerHTML = '<div style="color:var(--text-muted);">暂无调用数据 - 访问 API 端点后这里会显示各模型用量</div>';
      return;
    }
    const max = Math.max(...modelNames.map(k => models[k]));
    document.getElementById('modelBars').innerHTML = modelNames.map(k => `
      <div class="model-bar">
        <div style="font-weight:600;color:var(--text-secondary);">${k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(models[k]/max*100).toFixed(1)}%"></div></div>
        <div class="bar-val">${models[k]}</div>
      </div>
    `).join('');
  }

  async function loadUsers() {
    const data = await api('/api/admin/users');
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = data.users.map(u => `
      <tr>
        <td><strong>${u.username}</strong></td>
        <td><span class="role-badge ${u.role==='admin'?'role-admin':'role-user'}">${u.role}</span></td>
        <td>${u.email || '-'}</td>
        <td><span class="api-key">${u.api_key}</span></td>
        <td>
          <input type="number" class="quota-input" value="${u.quota_tokens}" min="0" data-user="${u.username}">
          <button class="quota-save-btn" data-user="${u.username}">保存</button>
        </td>
        <td style="font-size:12px;color:var(--text-muted);font-family:monospace;">${(u.created_at||'').slice(0,19).replace('T',' ')}</td>
        <td><button style="padding:4px 10px;background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3);border-radius:6px;cursor:pointer;font-size:12px;" onclick="resetQuota('${u.username}')">重置额度</button></td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.quota-save-btn').forEach(btn => {
      btn.onclick = () => {
        const username = btn.dataset.user;
        const input = tbody.querySelector(`input[data-user="${username}"]`);
        const quota = parseInt(input.value);
        api(`/api/admin/users/${username}/quota`, 'POST', { quota_tokens: quota }).then(() => {
          btn.textContent = '✓ 已保存';
          setTimeout(() => btn.textContent = '保存', 1500);
        });
      };
    });
  }

  // Navigation
  document.querySelectorAll('.admin-nav a[data-view]').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      document.querySelectorAll('.admin-nav a').forEach(x => x.classList.remove('active'));
      a.classList.add('active');
      const v = a.dataset.view;
      document.getElementById('viewTitle').textContent = {overview:'📊 数据概览', users:'👥 用户管理', models:'🧠 模型调用'}[v];
      ['overview','users','models'].forEach(x => document.getElementById('view-'+x).style.display = 'none');
      document.getElementById('view-'+v).style.display = '';
      if (v === 'users') loadUsers();
      if (v === 'overview') loadOverview();
    };
  });

  document.getElementById('adminLoginBtn').onclick = login;
  document.getElementById('adminPass').onkeydown = e => { if (e.key === 'Enter') login(); };
  document.getElementById('logoutBtn').onclick = logout;

  // Init
  if (token) {
    api('/api/admin/stats').then(() => showDash()).catch(() => showLogin());
  } else {
    showLogin();
  }

  window.resetQuota = (u) => {
    api(`/api/admin/users/${u}/quota`, 'POST', { quota_tokens: 100000 }).then(() => loadUsers());
  };
})();
</script>
</body>
</html>
